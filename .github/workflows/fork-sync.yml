name: Fork Sync

on:
    schedule:
        - cron: '17 22 * * *'
    workflow_dispatch:
    workflow_call:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: fork-sync-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    propose_update:
        name: Propose upstream update
        if: github.event.repository.fork && github.event_name != 'pull_request'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Open or reuse upstream pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              shell: bash
              run: |
                  set -euo pipefail
                  ahead=$(gh api "repos/$GH_REPO/compare/main...imzyb:main" --jq '.ahead_by')
                  if [ "$ahead" -eq 0 ]; then
                    echo 'Upstream is already included in main.' >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  existing=$(gh api "repos/$GH_REPO/pulls?state=open&base=main&head=imzyb:main" --jq '.[0].html_url // empty')
                  if [ -n "$existing" ]; then
                    echo "Upstream update PR: $existing" >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  if ! gh api "repos/$GH_REPO/pulls" \
                    -f title='Update MiSub from upstream; preserve custom rules' \
                    -f head='imzyb:main' -f base='main' \
                    -f body='Merge upstream without resetting main. Preserve no-resolve rule options, declared MRS behavior and refresh intervals, and existing Cloudflare runtime settings. Resolve conflicts and run the full test suite and build before merging. Cloudflare Pages deploys main after merge.' \
                    --jq '.html_url' >> "$GITHUB_STEP_SUMMARY"; then
                    echo '::warning::Could not create an upstream PR. Check repository PR permissions; no branch was overwritten.'
                    echo "Manual review required: https://github.com/$GH_REPO/compare/main...imzyb:MiSub:main?expand=1" >> "$GITHUB_STEP_SUMMARY"
                  fi

    verify:
        name: Verify update
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run test:run
            - run: npm run build
